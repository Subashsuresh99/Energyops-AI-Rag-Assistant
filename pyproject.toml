[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energyops-ai-rag"
version = "0.1.0"
description = "Energy analytics and document-grounded assistant"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "scikit-learn>=1.4,<2", "httpx>=0.27,<1", "pypdf>=4,<7"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36,<2", "pandas>=2.1,<3", "plotly>=5.20,<7", "requests>=2.31,<3"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
embeddings = ["sentence-transformers>=3,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
